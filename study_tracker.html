<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>勉強トラッカー</title>
<style>
:root{--bg:#f5f5f7;--surface:#ffffff;--surface2:#e8e8ed;--border:rgba(0,0,0,0.09);--text:#1c1c1e;--muted:rgba(60,60,67,0.5);--accent:#7c6fff;--green:#2d9e5f;--green-dim:rgba(45,158,95,0.12);--radius:16px;--radius-sm:10px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,'Hiragino Sans',sans-serif}
body{display:flex;flex-direction:column;align-items:center;min-height:100dvh;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.app{width:100%;max-width:420px;padding:0 16px 32px}
.header{padding:20px 0 16px;display:flex;align-items:center;justify-content:space-between}
.header-title{font-size:15px;font-weight:600;color:var(--text)}
.header-sub{font-size:11px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--surface);border-radius:var(--radius-sm);padding:10px 8px;text-align:center}
.stat-num{font-size:22px;font-weight:600;color:var(--text);line-height:1.2}
.stat-label{font-size:10px;color:var(--muted);margin-top:2px}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.card-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:12px}
.nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.nav-btn:active{background:var(--surface2)}
.nav-btn:disabled{opacity:0.3;cursor:default}
.cal-title{font-size:14px;font-weight:500;color:var(--text)}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px}
.weekday{font-size:11px;color:var(--muted);text-align:center;padding:3px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.day{aspect-ratio:1;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;color:var(--muted);transition:background .15s;user-select:none}
.day:active{transform:scale(0.92)}
.day.done{background:rgba(45,158,95,0.15);border-color:rgba(45,158,95,0.5);color:#2d9e5f;font-weight:500}
.day.today{border-color:#7c6fff;color:var(--text);font-weight:500}
.day.today.done{border-color:var(--green)}
.day.future{opacity:0.25;cursor:default;pointer-events:none}
.day.empty{border-color:transparent;cursor:default;pointer-events:none}
.subj-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.subj-row:last-child{border-bottom:none}
.subj-name{font-size:13px;color:var(--text);min-width:36px}
.bar-bg{flex:1;height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--green);transition:width .3s}
.subj-days{font-size:12px;color:var(--muted);min-width:28px;text-align:right}
.adj-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.adj-btn:active{background:var(--surface2);transform:scale(0.9)}
.reset-btn{width:100%;padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:none;color:var(--muted);font-size:13px;cursor:pointer;margin-top:4px}
.reset-btn:active{background:var(--surface2)}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <span class="header-title">📚 勉強トラッカー</span>
    <span class="header-sub" id="today-label"></span>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-num" id="s-streak">0</div><div class="stat-label">連続日数</div></div>
    <div class="stat"><div class="stat-num" id="s-total">0</div><div class="stat-label">今月の日数</div></div>
    <div class="stat"><div class="stat-num" id="s-rate">0%</div><div class="stat-label">達成率</div></div>
    <div class="stat"><div class="stat-num" id="s-best">0</div><div class="stat-label">最長連続</div></div>
  </div>

  <div class="card">
    <div class="nav-row">
      <button class="nav-btn" id="btn-prev" onclick="changeMonth(-1)">← 前月</button>
      <span class="cal-title" id="cal-title"></span>
      <button class="nav-btn" id="btn-next" onclick="changeMonth(1)">次月 →</button>
    </div>
    <div class="weekdays">
      <div class="weekday">日</div><div class="weekday">月</div><div class="weekday">火</div>
      <div class="weekday">水</div><div class="weekday">木</div><div class="weekday">金</div><div class="weekday">土</div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <div class="card">
    <div class="card-title">科目別進捗（今月）</div>
    <div id="subject-list"></div>
  </div>

  <button class="reset-btn" onclick="resetMonth()">今月をリセット</button>
</div>

<script>
const now = new Date();
let viewYear = now.getFullYear();
let viewMonth = now.getMonth();
const todayY = now.getFullYear();
const todayM = now.getMonth();
const todayD = now.getDate();

const allData = {};
const subjects = {数学:0, 英語:0, 国語:0, 理科:0, 社会:0};
const target = 20;

document.getElementById('today-label').textContent =
  (todayM+1)+'月'+todayD+'日';

function key(y,m){ return y+'-'+m; }
function getDone(){ return allData[key(viewYear,viewMonth)] || new Set(); }
function setDone(s){ allData[key(viewYear,viewMonth)] = s; }

function buildCal(){
  const g = document.getElementById('cal-grid');
  g.innerHTML = '';
  const dim = new Date(viewYear, viewMonth+1, 0).getDate();
  const first = new Date(viewYear, viewMonth, 1).getDay();
  const done = getDone();
  const isCurrent = viewYear===todayY && viewMonth===todayM;

  document.getElementById('cal-title').textContent = viewYear+'年'+(viewMonth+1)+'月';
  document.getElementById('btn-next').disabled = isCurrent;

  for(let i=0;i<first;i++){
    const e=document.createElement('div');
    e.className='day empty';
    g.appendChild(e);
  }
  for(let d=1;d<=dim;d++){
    const e=document.createElement('div');
    const isToday = isCurrent && d===todayD;
    const isFuture = isCurrent && d>todayD;
    let cls='day';
    if(done.has(d)) cls+=' done';
    if(isToday) cls+=' today';
    if(isFuture) cls+=' future';
    e.className=cls;
    e.textContent=d;
    if(!isFuture) e.onclick=()=>toggleDay(d);
    g.appendChild(e);
  }
  updateStats();
}

function toggleDay(d){
  const done=new Set(getDone());
  done.has(d)?done.delete(d):done.add(d);
  setDone(done);
  buildCal();
}

function changeMonth(dir){
  viewMonth+=dir;
  if(viewMonth<0){viewMonth=11;viewYear--;}
  if(viewMonth>11){viewMonth=0;viewYear++;}
  buildCal();
}

function updateStats(){
  const done=getDone();
  const total=done.size;
  document.getElementById('s-total').textContent=total;
  document.getElementById('s-rate').textContent=Math.min(Math.round(total/target*100),100)+'%';

  let streak=0;
  if(viewYear===todayY&&viewMonth===todayM){
    for(let d=todayD;d>=1;d--){if(done.has(d))streak++;else break;}
  }
  let best=0,cur=0;
  const dim=new Date(viewYear,viewMonth+1,0).getDate();
  for(let d=1;d<=dim;d++){if(done.has(d)){cur++;best=Math.max(best,cur);}else cur=0;}
  document.getElementById('s-streak').textContent=streak;
  document.getElementById('s-best').textContent=best;
  buildSubjects();
}

function buildSubjects(){
  const el=document.getElementById('subject-list');
  el.innerHTML='';
  Object.entries(subjects).forEach(([name,days])=>{
    const pct=Math.min(Math.round(days/target*100),100);
    const row=document.createElement('div');
    row.className='subj-row';
    row.innerHTML=`
      <span class="subj-name">${name}</span>
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
      <span class="subj-days">${days}日</span>
      <button class="adj-btn" onclick="adj('${name}',-1)">−</button>
      <button class="adj-btn" onclick="adj('${name}',1)">＋</button>
    `;
    el.appendChild(row);
  });
}

function adj(name,delta){
  subjects[name]=Math.max(0,Math.min((subjects[name]||0)+delta,31));
  buildSubjects();
}

function resetMonth(){
  if(confirm('今月の記録をリセットしますか？')){
    setDone(new Set());
    buildCal();
  }
}

buildCal();
</script>
</body>
</html>
